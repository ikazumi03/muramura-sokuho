name: Weekly Site Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * 0'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check pages and internal links
        env:
          SITE_URL: https://muramura-sokuho.pages.dev
        run: python ops/site_audit.py --base-url "$SITE_URL"

      - name: Save audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-site-audit
          path: reports/latest.*
          if-no-files-found: warn
          retention-days: 30
